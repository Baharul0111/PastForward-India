<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PastForward India</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0f0b16;
        color: #f4ecdf;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      main { padding: 2rem; max-width: 30rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.75rem; letter-spacing: 0.01em; }
      p { font-size: 0.95rem; line-height: 1.6; opacity: 0.75; margin: 0.5rem 0; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: rgba(255, 255, 255, 0.08);
        padding: 0.15em 0.4em;
        border-radius: 4px;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PastForward India</h1>
      <p>Connecting to the studio on your local network&hellip;</p>
      <p>
        If this screen stays up, make sure the phone and the laptop are on the
        same Wi-Fi, and that the backend is running with
        <code>npm run dev:lan</code>.
      </p>
    </main>
  </body>
</html>
